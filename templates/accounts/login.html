<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход — CRM</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #1a1d2e 0%, #2d3057 100%);
            min-height: 100vh;
        }
        .login-card {
            border: none; border-radius: 1.25rem;
            box-shadow: 0 20px 60px rgba(0,0,0,.35);
        }
        .login-brand {
            width: 56px; height: 56px; border-radius: .9rem;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            display: flex; align-items: center; justify-content: center;
            font-size: 1.7rem; margin: 0 auto 1rem;
        }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center p-3">

<div class="card login-card" style="width:100%;max-width:380px">
    <div class="card-body p-4">
        <div class="text-center mb-4">
            <div class="login-brand text-white">
                <i class="bi bi-diagram-3-fill"></i>
            </div>
            <h5 class="fw-bold mb-0">CRM-система</h5>
            <p class="text-muted small">Войдите в свой аккаунт</p>
        </div>

        {% if form.errors %}
        <div class="alert alert-danger py-2 small">
            <i class="bi bi-exclamation-triangle me-1"></i>
            Неверный логин или пароль
        </div>
        {% endif %}

        <form method="post" action="{% url 'accounts:login' %}">
            {% csrf_token %}
            <input type="hidden" name="next" value="{{ next }}">

            <div class="mb-3">
                <label class="form-label small fw-semibold">Логин</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-person"></i></span>
                    <input type="text" name="username" class="form-control"
                           placeholder="Введите логин" autofocus required>
                </div>
            </div>

            <div class="mb-4">
                <label class="form-label small fw-semibold">Пароль</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-lock"></i></span>
                    <input type="password" name="password" class="form-control"
                           placeholder="Введите пароль" required>
                    <button class="btn btn-outline-secondary" type="button" id="togglePwd">
                        <i class="bi bi-eye" id="eyeIcon"></i>
                    </button>
                </div>
            </div>

            <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">
                <i class="bi bi-box-arrow-in-right me-1"></i>Войти
            </button>
        </form>
    </div>
    <div class="card-footer text-center text-muted small py-2 bg-transparent border-0">
        CRM-система © {{ "now"|date:"Y" }}
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
document.getElementById('togglePwd').addEventListener('click', function () {
    const pwd = document.querySelector('input[name="password"]');
    const icon = document.getElementById('eyeIcon');
    if (pwd.type === 'password') {
        pwd.type = 'text';
        icon.className = 'bi bi-eye-slash';
    } else {
        pwd.type = 'password';
        icon.className = 'bi bi-eye';
    }
});
</script>
</body>
</html>
